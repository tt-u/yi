name: Release

# Push a tag like v0.1.0 (matching the version in package.json) to build
# installers for macOS (arm64 + x64) and Windows (x64) and attach them to a
# single GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Build installers per platform and upload them as workflow artifacts.
  # (Building does NOT publish — that avoids two runners racing to create the
  # release and splitting the assets across duplicate drafts.)
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          # Built into the renderer so released apps offer the "Built-in (free)"
          # relay. Leave these secrets unset to ship own-key-only builds.
          VITE_RELAY_URL: ${{ secrets.VITE_RELAY_URL }}
          VITE_RELAY_TOKEN: ${{ secrets.VITE_RELAY_TOKEN }}
      - run: pnpm exec electron-builder --${{ matrix.platform }} --publish never
        env:
          # macOS Developer ID signing + notarization (empty on Windows so it
          # doesn't try to sign with the macOS certificate).
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          # Only the user-facing installers; skip blockmap / latest*.yml (auto-update metadata)
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  # Collect every platform's installers and attach them to ONE draft release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # Rename to user-friendly names (arm64 -> Apple Silicon, x64 -> Intel).
      - name: Rename installers
        run: |
          cd artifacts
          ver="${GITHUB_REF_NAME#v}"
          for f in *-arm64.dmg; do [ -e "$f" ] && mv "$f" "Yi-${ver}-macOS-Apple-Silicon.dmg"; done
          for f in *-x64.dmg;   do [ -e "$f" ] && mv "$f" "Yi-${ver}-macOS-Intel.dmg"; done
          for f in *-setup.exe; do [ -e "$f" ] && mv "$f" "Yi-${ver}-Windows-x64-Setup.exe"; done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
