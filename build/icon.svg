    <radialGradient id="orbGradient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(518 309) rotate(90) scale(58)">
      <stop offset="0" stop-color="#F0FFFB"/>
      <stop offset="0.55" stop-color="#81F8ED"/>
      <stop offset="1" stop-color="#2A9BDA"/>
    </radialGradient>

    <linearGradient id="highlightGradient" x1="300" y1="375" x2="759" y2="363" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.78"/>
      <stop offset="0.52" stop-color="#DFFFFB" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.82"/>
    </linearGradient>

    <clipPath id="iconClip">
