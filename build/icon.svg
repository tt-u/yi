    <linearGradient id="symbolGradient" x1="334" y1="810" x2="760" y2="306" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D60E8"/>
      <stop offset="0.34" stop-color="#1DA7EF"/>
      <stop offset="0.67" stop-color="#57F0D7"/>
      <stop offset="1" stop-color="#D5FFF6"/>
    </linearGradient>

    <linearGradient id="leftLeafGradient" x1="254" y1="389" x2="531" y2="646" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DBFFF8"/>
      <stop offset="0.45" stop-color="#4CECDC"/>
      <stop offset="1" stop-color="#0666DF"/>
    </linearGradient>

    <linearGradient id="rightLeafGradient" x1="515" y1="642" x2="799" y2="328" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D78E9"/>
      <stop offset="0.48" stop-color="#42E7D1"/>
      <stop offset="1" stop-color="#DFFFF7"/>
