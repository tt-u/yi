    <g clip-path="url(#iconClip)">
      <rect x="92" y="92" width="840" height="840" rx="184" fill="url(#topGlow)"/>
      <rect x="92" y="92" width="840" height="840" rx="184" fill="url(#bottomGlow)"/>
      <path d="M170 141C273 90 397 99 512 111C676 129 818 95 917 214V92H92V225C113 185 136 158 170 141Z" fill="#FFFFFF" opacity="0.08"/>
      <path d="M160 836C255 905 417 939 564 917C687 899 798 861 932 881V932H92V812C111 819 134 827 160 836Z" fill="#020B2F" opacity="0.22"/>
    </g>
    <rect x="94" y="94" width="836" height="836" rx="182" stroke="url(#rimGradient)" stroke-width="4"/>
    <rect x="103" y="103" width="818" height="818" rx="174" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
  </g>

  <g filter="url(#symbolShadow)">
    <path d="M506 819C545 740 532 677 488 625C449 579 381 541 296 488C389 511 470 556 514 624C560 556 654 499 785 352C772 504 684 589 590 645C537 677 533 743 506 819Z" fill="url(#symbolGradient)"/>

    <path d="M505 626C435 596 359 545 304 474C270 430 251 390 246 353C296 419 371 461 444 495C505 524 537 572 505 626Z" fill="url(#leftLeafGradient)"/>

    <path d="M534 622C579 539 667 493 732 433C773 395 798 359 809 319C821 454 751 557 643 605C600 624 561 628 534 622Z" fill="url(#rightLeafGradient)"/>

    <path d="M246 353C303 423 372 464 444 495C502 520 535 568 509 620" stroke="url(#highlightGradient)" stroke-width="18" stroke-linecap="round" opacity="0.52"/>
    <path d="M808 320C773 388 713 445 642 487C591 518 556 562 536 618" stroke="url(#highlightGradient)" stroke-width="18" stroke-linecap="round" opacity="0.55"/>

    <path d="M508 819C545 740 532 677 488 625" stroke="#BFFFF7" stroke-width="8" stroke-linecap="round" opacity="0.2"/>
    <path d="M514 624C560 556 654 499 785 352" stroke="#EFFFFC" stroke-width="8" stroke-linecap="round" opacity="0.24"/>
  </g>

  <g filter="url(#orbGlow)">
    <circle cx="518" cy="309" r="51" fill="url(#orbGradient)"/>
    <circle cx="503" cy="292" r="14" fill="#FFFFFF" opacity="0.42"/>
  </g>

  <path d="M521 257C549 257 572 280 572 309" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.38"/>
</svg>
