<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Yi symbolic app icon</title>
  <desc id="desc">A minimalist rounded-square app icon with a luminous abstract sprout symbol, representing growth, connection, and clarity.</desc>
  <defs>
    <linearGradient id="bgGradient" x1="151" y1="905" x2="881" y2="138" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#061C66"/>
      <stop offset="0.38" stop-color="#0A328C"/>
      <stop offset="0.72" stop-color="#168BC1"/>
      <stop offset="1" stop-color="#56F0CD"/>
    </linearGradient>

    <radialGradient id="topGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(646 256) rotate(124) scale(550 470)">
      <stop offset="0" stop-color="#A8FFF3" stop-opacity="0.48"/>
      <stop offset="0.48" stop-color="#2AC6D4" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#00144B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bottomGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(365 770) rotate(-34) scale(410 330)">
      <stop offset="0" stop-color="#1E6BFF" stop-opacity="0.48"/>
      <stop offset="0.54" stop-color="#0A49C7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00144B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rimGradient" x1="209" y1="122" x2="856" y2="892" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FF7FF" stop-opacity="0.52"/>
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.74" stop-color="#3CA8FF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#001445" stop-opacity="0.46"/>
